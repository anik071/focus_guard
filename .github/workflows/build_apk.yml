name: Build Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Generate Clean Android Wrapper & Merge Custom Files
        run: |
          mkdir -p /tmp/backup_android
          cp -r android/app/src/main/* /tmp/backup_android/
          rm -rf android
          flutter create . --platforms=android --org com.example --project-name focus_guard
          rm -rf android/app/src/main/java
          cp -r /tmp/backup_android/* android/app/src/main/

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FocusGuard-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
